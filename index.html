<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>APUSH Timeline & Flashcards</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;">
<div id="root"></div>

<script type="text/babel">

const { useState } = React;

// --- YOUR DATA (UNCHANGED) ---
const allVocab = [
  { term: "French and Indian War", def: "1754–1763 conflict between Britain and France over the Ohio River Valley. Britain won but gained debt → taxed colonies → resentment." },
  { term: "Proclamation Line of 1763", def: "Britain banned westward settlement → colonists angry → increased anti-British tension." },
  { term: "Stamp Act (1765)", def: "Tax on paper goods → protests ('No taxation') → repeal but more control asserted." },
  { term: "Boston Tea Party", def: "Colonists dumped tea → Britain punished colonies → Intolerable Acts increased conflict." },
  { term: "Common Sense (1776)", def: "Paine argued independence → shifted public opinion → led to Declaration." },
  { term: "Declaration of Independence", def: "Declared separation → justified by natural rights → started full revolution." },
  { term: "Battle of Saratoga", def: "American win → France joins → turning point of war." },
  { term: "Articles of Confederation", def: "Weak gov → couldn't tax/control → led to instability." },
  { term: "Shays' Rebellion", def: "Farmers rebel → gov can't stop → proves Articles failed." },
  { term: "Constitution (1787)", def: "Stronger gov → separation of powers → stable system created." },
];

// --- APP ---
function App() {
  const [cardIndex, setCardIndex] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [cards, setCards] = useState(allVocab);

  const next = () => {
    setFlipped(false);
    setTimeout(() => {
      setCardIndex((cardIndex + 1) % cards.length);
    }, 150);
  };

  const prev = () => {
    setFlipped(false);
    setTimeout(() => {
      setCardIndex((cardIndex - 1 + cards.length) % cards.length);
    }, 150);
  };

  const shuffle = () => {
    const shuffled = [...cards].sort(() => Math.random() - 0.5);
    setCards(shuffled);
    setCardIndex(0);
    setFlipped(false);
  };

  return (
    <div style={{
      minHeight: "100vh",
      background: "#0f0f0f",
      color: "#f0e6c8",
      fontFamily: "Georgia"
    }}>
      
      <h1 style={{textAlign:"center", padding:"20px"}}>
        APUSH Flashcards
      </h1>

      <div style={{textAlign:"center"}}>
        Card {cardIndex + 1} / {cards.length}
      </div>

      {/* CARD */}
      <div
        onClick={() => setFlipped(!flipped)}
        style={{
          margin:"40px auto",
          width:"300px",
          minHeight:"200px",
          display:"flex",
          alignItems:"center",
          justifyContent:"center",
          padding:"20px",
          border:"2px solid #c9a227",
          borderRadius:"10px",
          cursor:"pointer",
          background: flipped ? "#1a2e1a" : "#1a1a2e"
        }}
      >
        {flipped ? cards[cardIndex].def : cards[cardIndex].term}
      </div>

      {/* CONTROLS */}
      <div style={{textAlign:"center"}}>
        <button onClick={prev}>Prev</button>
        <button onClick={()=>setFlipped(!flipped)}>Flip</button>
        <button onClick={next}>Next</button>
        <button onClick={shuffle}>Shuffle</button>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
